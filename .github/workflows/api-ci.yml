name: FARSOIL API verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Worker bundle dry run
        run: npm run worker:dry-run
      - name: Worker local runtime smoke
        run: |
          npx --yes wrangler@4.162.0 dev --local --port 8787 --config wrangler.jsonc > worker-dev.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health
          REGISTER=$(curl -fsS -X POST http://127.0.0.1:8787/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            --data '{"email":"worker-ci@example.com","password":"secure-password-1234"}')
          TOKEN=$(node -e 'const v=JSON.parse(process.argv[1]); if(!v.token)process.exit(2); process.stdout.write(v.token)' "$REGISTER")
          curl -fsS http://127.0.0.1:8787/api/v1/auth/me -H "Authorization: Bearer $TOKEN"
          curl -fsS http://127.0.0.1:8787/api/v1/economy/worlds/worker-ci -H "Authorization: Bearer $TOKEN"
          BOOTSTRAP=$(curl -fsS http://127.0.0.1:8787/api/v1/auction/bootstrap -H "Authorization: Bearer $TOKEN")
          node -e 'const v=JSON.parse(process.argv[1]); if(!v.wallet||!v.market)process.exit(2)' "$BOOTSTRAP"
          LISTING=$(curl -fsS -X POST http://127.0.0.1:8787/api/v1/auction/listings \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: worker-auction-ci-0001' \
            --data '{"itemId":"wood","quantityU":"1","startUnitPriceGold":1,"buyoutPriceGold":2,"durationSeconds":1800}')
          node -e 'const v=JSON.parse(process.argv[1]); if(!v.auction||v.auction.status!=="OPEN")process.exit(2)' "$LISTING"
          RETRY=$(curl -fsS -X POST http://127.0.0.1:8787/api/v1/auction/listings \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: worker-auction-ci-0001' \
            --data '{"itemId":"wood","quantityU":"1","startUnitPriceGold":1,"buyoutPriceGold":2,"durationSeconds":1800}')
          node -e 'const a=JSON.parse(process.argv[1]),b=JSON.parse(process.argv[2]); if(a.requestId!==b.requestId||a.auction.auctionId!==b.auction.auctionId)process.exit(2)' "$LISTING" "$RETRY"
          kill "$WORKER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Drop configuration preflight
        run: npm run drop:preflight
      - name: Tests
        run: npm test
      - name: Docker smoke
        run: |
          docker build -t farsoil-api:ci .
          docker run -d --name farsoil-api-ci -p 3001:3001 farsoil-api:ci
          trap 'docker rm -f farsoil-api-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              curl -fsS http://127.0.0.1:3001/health
              exit 0
            fi
            sleep 1
          done
          docker logs farsoil-api-ci
          exit 1
